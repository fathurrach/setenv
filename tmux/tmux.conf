# ==============================================================================
# TMUX BEST PRACTICE CONFIGURATION (LOCAL DEV & MULTI-SERVER REMOTE)
# Theme: Catppuccin Macchiato | Nerd Fonts: Enabled
# Managed by setenv (https://github.com/fathurrach/setenv)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Prefix Key (Ctrl+b - Default Tmux)
# ------------------------------------------------------------------------------
unbind C-a
set -g prefix C-b
bind C-b send-prefix
bind b send-prefix

# ------------------------------------------------------------------------------
# 2. General Settings
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g history-limit 100000
set -g mouse on
set -g focus-events on
setw -g mode-keys vi

# Window & Pane Indexing mulai dari 1 (bukan 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload konfigurasi dengan Prefix + r
bind r source-file ~/.tmux.conf \; display-message "✓ Tmux config reloaded!"

# ------------------------------------------------------------------------------
# 3. Split Window (| dan -) & Navigasi
# ------------------------------------------------------------------------------
unbind '"'
unbind %

# Split horizontal & vertikal mempertahankan direktori kerja aktif
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navigasi pane gaya Vim (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane gaya Vim (Prefix + Shift + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ------------------------------------------------------------------------------
# 4. Multi-Server Management: Synchronize Panes (Prefix + S)
# ------------------------------------------------------------------------------
bind S setw synchronize-panes \; display-message "Toggle Synchronize Panes: #{?pane_synchronized,ON,OFF}"

# ------------------------------------------------------------------------------
# 5. Vi Copy-Mode & Integrasi Clipboard
# ------------------------------------------------------------------------------
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell "uname | grep -q Darwin" \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard 2>/dev/null || xsel -ib 2>/dev/null"'

# ------------------------------------------------------------------------------
# 6. Tema Catppuccin Macchiato & Status Bar
# ------------------------------------------------------------------------------
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load plugin Catppuccin
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Status Bar General Settings (Posisi di bawah, tab window tepat di tengah)
set -g status-position bottom
set -g status-justify centre
set -g status-interval 3
set -g status-left-length 150
set -g status-right-length 150

# Status Bar Sebelah Kiri:
# [Informasi Mesin (Mauve)] + [Lokasi Direktori (Rosewater)] + [Uptime (Sapphire)]
set -g status-left "#[fg=#c6a0f6,bg=default]#[fg=#181926,bg=#c6a0f6]󰒋 #[fg=#cad3f5,bg=#363a4f] #h#[fg=#363a4f,bg=default] "
set -ag status-left "#[fg=#f4dbd6,bg=default]#[fg=#181926,bg=#f4dbd6] #[fg=#cad3f5,bg=#363a4f] #{b:pane_current_path}#[fg=#363a4f,bg=default] "
set -ag status-left "#[fg=#7dc4e4,bg=default]#[fg=#181926,bg=#7dc4e4]󰔟 #[fg=#cad3f5,bg=#363a4f] #(~/.tmux/scripts/resource_info.sh uptime)#[fg=#363a4f,bg=default] "

# Status Bar Sebelah Kanan:
# [CPU Bar (Yellow)] + [Memory Used/Total Bar (Teal)] + [Storage Used/Total Bar (Sky)]
set -g status-right "#[fg=#eed49f,bg=default]#[fg=#181926,bg=#eed49f] #[fg=#cad3f5,bg=#363a4f] #(~/.tmux/scripts/resource_info.sh cpu)#[fg=#363a4f,bg=default] "
set -ag status-right "#[fg=#8bd5ca,bg=default]#[fg=#181926,bg=#8bd5ca]󰍛 #[fg=#cad3f5,bg=#363a4f] #(~/.tmux/scripts/resource_info.sh mem)#[fg=#363a4f,bg=default] "
set -ag status-right "#[fg=#91d7e3,bg=default]#[fg=#181926,bg=#91d7e3]󰋊 #[fg=#cad3f5,bg=#363a4f] #(~/.tmux/scripts/resource_info.sh storage)#[fg=#363a4f,bg=default] "

# ------------------------------------------------------------------------------
# 7. Plugins (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.2'

# Opsi session auto-restore
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Inisialisasi TPM (Wajib berada di baris paling bawah)
run '~/.tmux/plugins/tpm/tpm'
