# ==============================================================================
# STARSHIP CONFIGURATION - CATPPUCCIN MACCHIATO
# Managed by setenv (https://github.com/fathurrach/setenv)
# ==============================================================================

# Inserts a blank line between shell prompts
add_newline = true

# Palette selection
palette = "catppuccin_macchiato"

# Custom prompt format
format = """
$os\
$directory\
$git_branch\
$git_status\
$nodejs\
$golang\
$rust\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ------------------------------------------------------------------------------
# Modules Configuration
# ------------------------------------------------------------------------------

[character]
success_symbol = "[[❯](green) ](bold)"
error_symbol = "[[❯](red) ](bold)"
vimcmd_symbol = "[[❮](subtext0) ](bold)"

[directory]
style = "bold sapphire"
truncation_length = 4
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[os]
disabled = false
style = "bold mauve"

[os.symbols]
Macos = " "
Ubuntu = " "
Debian = " "
Arch = " "
CentOS = " "
Fedora = " "
Alpine = " "
Linux = " "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold teal"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
style = "bold maroon"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

# ------------------------------------------------------------------------------
# Catppuccin Macchiato Color Palette
# ------------------------------------------------------------------------------
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#a5adcb"
subtext0 = "#b8c0e0"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
